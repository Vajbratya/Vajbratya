name: Refresh profile activity signal

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate-activity.mjs'
      - 'scripts/render-ship-signal.mjs'
      - '.github/workflows/activity.yml'

permissions:
  contents: write

concurrency:
  group: profile-activity-signal
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch GitHub contribution data
        run: node scripts/generate-activity.mjs
        env:
          PROFILE_USERNAME: Vajbratya
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render Ship Signal
        run: node scripts/render-ship-signal.mjs
        env:
          PROFILE_USERNAME: Vajbratya

      - name: Commit refreshed assets
        run: |
          if git diff --quiet -- assets/activity.svg docs/data.json; then
            echo "Activity signal is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg docs/data.json
          git commit -m "chore(profile): refresh activity signal"
          git push
