<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Natan GitHub activity signal</title>
  <desc id="desc">The self-hosted GitHub activity signal is syncing for the first time.</desc>
  <style>
    :root { --bg:#09090b; --fg:#fafafa; --muted:#8b8b93; --grid:#24242a; --accent:#39d353; }
    @media (prefers-color-scheme: light) { :root { --bg:#fff; --fg:#111; --muted:#66666f; --grid:#e7e7ea; --accent:#138a39; } }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif; fill:var(--fg); }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace; }
    .eyebrow { font-size:13px; font-weight:700; letter-spacing:1.8px; }
    .muted { fill:var(--muted); }
    .value { font-size:54px; font-weight:750; letter-spacing:-2.8px; }
    .label { font-size:11px; font-weight:650; letter-spacing:1.1px; fill:var(--muted); }
    .signal { fill:none; stroke:var(--fg); stroke-width:2.4; stroke-linecap:round; stroke-dasharray:1600; stroke-dashoffset:1600; animation:draw 2.2s cubic-bezier(.16,1,.3,1) forwards; }
    .pulse { fill:var(--accent); animation:pulse 1.6s ease-in-out infinite; }
    @keyframes draw { to { stroke-dashoffset:0; } }
    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  </style>
  <rect width="1200" height="520" rx="18" fill="var(--bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="519" rx="17.5" fill="none" stroke="var(--grid)"/>
  <circle class="pulse" cx="68" cy="50" r="4"/>
  <text class="eyebrow mono" x="82" y="55">NATAN / SHIP SIGNAL</text>
  <text class="eyebrow mono muted" x="1136" y="55" text-anchor="end">SELF-HOSTED · GITHUB · UTC</text>
  <text class="value" x="64" y="138">5,901</text>
  <text class="label mono" x="66" y="161">CONTRIBUTIONS · LAST YEAR · INITIAL SYNC</text>
  <line x1="64" x2="1136" y1="205" y2="205" stroke="var(--grid)"/>
  <line x1="64" x2="1136" y1="285" y2="285" stroke="var(--grid)" opacity=".65"/>
  <line x1="64" x2="1136" y1="365" y2="365" stroke="var(--grid)"/>
  <path class="signal" d="M64 333 C125 337 139 299 194 305 C250 310 260 275 319 287 C379 300 392 229 456 254 C511 276 527 238 585 250 C646 263 654 212 714 238 C773 264 786 218 845 235 C903 252 913 201 973 220 C1026 237 1054 184 1136 206"/>
  <text class="label mono" x="64" y="414">NO THIRD-PARTY GRAPH SERVICE</text>
  <text class="label mono" x="64" y="439">GITHUB ACTIONS → GITHUB DATA → VERSIONED SVG</text>
  <text class="label mono" x="64" y="464">FIRST REFRESH REPLACES THIS BOOT FRAME WITH LIVE DAILY DATA.</text>
  <text class="label mono" x="1136" y="503" text-anchor="end">CLICK → RAW SVG · DAILY CELLS BECOME INTERACTIVE AFTER SYNC</text>
</svg>
